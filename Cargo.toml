[package]
name = "lumin_wallpaper_rs"
version = "0.1.0"
edition = "2024"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi"

] }

[dev-dependencies]
wry = "0.53"
tao = "0.34"
macroquad = "0.4"
miniquad = "0.4"

[dependencies]
chrono = "0.4.45"

[profile.dev]
codegen-units = 256
debug = 0
