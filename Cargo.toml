[package]
name = "wallopino"
version = "0.1.0"
edition = "2024"
authors = ["amir.frjn.84@gmail.com"]
description = "A Rust library for attaching windows behind the Windows desktop icons."
license = "MIT"
repository = "https://github.com/amir-frjn/wallopino"
readme = "README.md"
keywords = ["windows", "wallpaper", "desktop", "winapi", "webview"]
categories = ["os::windows-apis"]
homepage = "https://github.com/amir-frjn/wallopino"
documentation = "https://docs.rs/wallopino"
exclude = [
    "Cargo.lock",
    "Cargo.toml.orig",
     "assets/*.gif",
    "assets/*.GIF",
]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi"

] }

[dev-dependencies]
wry = "0.53"
tao = "0.34"
macroquad = "0.4"


